[project]
name = "ch4"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas==2.2.3",
    "plotnine==0.14.3",
    "mlflow==3.0.0",
    "matplotlib==3.9.2",
    "minio==7.1.16",
    "xgboost==1.7.6",
    "feast==0.40.1",
    "redis==4.6.0",
    "s3fs==2024.10.0",
    "boto3==1.35.36",
    "fsspec==2024.10.0",
    "aiobotocore==2.15.2",
    "seaborn==0.13.2",
    "scikit-learn>=1.5.2",
]

[tool.uv]
# feast 0.40.1 / s3fs 2024.10 시점에 맞춰 전이 의존성 상한을 고정한다.
# 상한이 없으면 dask 2026.x, pyarrow 20.x가 잡혀 feast 런타임에서 깨질 수 있다.
constraint-dependencies = [
    "dask<2025.0.0",
    "pyarrow<18.0.0",
    # xgboost 1.7.6의 sklearn 래퍼가 1.6+의 __sklearn_tags__ API와 맞지 않는다.
    "scikit-learn<1.6",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
