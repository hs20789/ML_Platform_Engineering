apiVersion: apps/v1

kind: Deployment

metadata:
  name: joker-deployment
  labels:
    app: fast-api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: fast-api

  template:
    metadata:
      name: joker
      labels:
        app: fast-api

    spec:
      containers:
        - name: hello-joker
          image: heons/hello-joker:v1
          ports:
            - containerPort: 8083

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
